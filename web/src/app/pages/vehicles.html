<div class="mb-5 flex flex-wrap items-end justify-between gap-4">
  <div>
    <p class="kicker">Records</p>
    <h1 class="mb-0 mt-1 text-2xl font-semibold">Vehicles</h1>
  </div>
  <p-button label="Add vehicle" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<input class="mb-4" pInputText placeholder="Search plate, model, or owner" (input)="onQuery($event)" />

<div class="page-card overflow-hidden">
  <p-table [value]="filtered()" [paginator]="true" [rows]="8" styleClass="text-sm" [rowHover]="true">
    <ng-template #header>
      <tr>
        <th>Plate</th>
        <th>Vehicle</th>
        <th>Owner</th>
        <th>Insurance</th>
        <th>Registration</th>
        <th>Flags</th>
      </tr>
    </ng-template>
    <ng-template #body let-vehicle>
      <tr class="cursor-pointer" (click)="openEdit(vehicle)">
        <td class="font-semibold">{{ vehicle.plate }}</td>
        <td>{{ vehicle.color }} {{ vehicle.model }}</td>
        <td>{{ vehicle.owner ? vehicle.owner.firstName + ' ' + vehicle.owner.lastName : '—' }}</td>
        <td><p-tag [value]="labelFor(vehicle.insurance)" [severity]="vehicle.insurance === 'valid' ? 'success' : 'warn'" /></td>
        <td><p-tag [value]="labelFor(vehicle.registration)" [severity]="vehicle.registration === 'valid' ? 'success' : 'warn'" /></td>
        <td>
          <div class="flex flex-wrap gap-1">
            @for (flag of splitFlags(vehicle.flags); track flag) {
              <p-tag [value]="flag" severity="danger" />
            }
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="6">No matching vehicles.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [header]="editing ? 'Edit vehicle' : 'Add vehicle'" [(visible)]="visible" [modal]="true" [style]="{ width: '36rem' }" [dismissableMask]="true">
  <form [formGroup]="form" (ngSubmit)="save()">
    <p-fluid class="grid gap-3 sm:grid-cols-2">
      <label class="field"><span>Plate</span><input pInputText formControlName="plate" /></label>
      <label class="field"><span>Color</span><input pInputText formControlName="color" /></label>
      <label class="field sm:col-span-2"><span>Model</span><input pInputText formControlName="model" /></label>
      <label class="field sm:col-span-2"><span>Owner</span><p-select formControlName="ownerId" [options]="owners()" optionLabel="label" optionValue="value" [filter]="true" appendTo="body" /></label>
      <label class="field"><span>Insurance</span><p-select formControlName="insurance" [options]="states" optionLabel="label" optionValue="value" appendTo="body" /></label>
      <label class="field"><span>Registration</span><p-select formControlName="registration" [options]="states" optionLabel="label" optionValue="value" appendTo="body" /></label>
      <label class="field sm:col-span-2"><span>Flags</span><input pInputText formControlName="flags" placeholder="Comma separated" /></label>
      <label class="field sm:col-span-2"><span>Notes</span><textarea pTextarea rows="3" formControlName="notes"></textarea></label>
    </p-fluid>
    <div class="mt-4 flex justify-end gap-2">
      <p-button type="button" label="Cancel" [text]="true" severity="secondary" (onClick)="visible = false" />
      <p-button type="submit" label="Save" [loading]="busy" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
